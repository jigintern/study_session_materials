name: build-slides

on:
  workflow_call:

permissions:
  contents: read

env:
  LANG: "ja_JP.UTF-8"
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      slides: ${{ steps.targets.outputs.slides }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Targets
        id: targets
        run: echo "slides=$(jq -c . tools/build-slides/slides.json)" >> "$GITHUB_OUTPUT"

  build-slides:
    needs:
      - select
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.slides) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Packages
        run: sudo apt update -y && sudo apt install -y jq fonts-noto

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install

      - name: Make Directory
        run: |
          mkdir dest
          for dir in imgs diagrams screenshots; do
            src="./${{ matrix.slide }}/$dir"
            if [ -d "$src" ]; then
              cp -r "$src" "./dest/$dir"
            fi
          done

      - name: Copy Web App (open-data-2026 only)
        if: matrix.output_name == 'open-data-2026'
        run: |
          cp ./${{ matrix.slide }}/index.html ./dest/index.html
          cp ./${{ matrix.slide }}/styles.css ./dest/styles.css
          cp ./${{ matrix.slide }}/app.js ./dest/app.js
          cp ./${{ matrix.slide }}/map.html ./dest/map.html
          cp ./${{ matrix.slide }}/open-meteo.html ./dest/open-meteo.html

      - name: Build Marp PDF
        run: pnpm exec marp ${{ matrix.slide }}/slide.md
          --pdf
          -o ./dest/slide.pdf
          --allow-local-files

      - name: Build Marp HTML
        run: pnpm exec marp ${{ matrix.slide }}/slide.md
          --html
          -o ./dest/slide.html
          --allow-local-files

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ./dest
