<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>みんなの掲示板</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>みんなの掲示板</h1>

      <div class="form">
        <input id="name-input" type="text" placeholder="名前" />
        <input id="text-input" type="text" placeholder="メッセージ" />
        <div class="buttons">
          <button id="post-btn" class="primary">投稿する</button>
          <button id="reload-btn">更新する</button>
        </div>
      </div>

      <ul id="posts"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
