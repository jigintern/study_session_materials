<!DOCTYPE html>
<!-- ミニX の画面の部品と並びを書くファイル。見た目は styles.css、動きは script.js が受け持つ -->
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミニX</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- 画面全体を、左のメニュー・真ん中（main）・右のサイドバーの 3 つに分けて横に並べる -->
    <div class="layout">
      <!-- 左のメニュー。はじめから用意してある飾りで、押しても何も起きない -->
      <nav class="sidebar-left">
        <div class="wordmark">ミニX</div>
        <a class="nav-item nav-home">ホーム</a>
        <a class="nav-item nav-search">話題を検索</a>
        <a class="nav-item nav-notifications">通知</a>
        <a class="nav-item nav-messages">メッセージ</a>
        <a class="nav-item nav-profile">プロフィール</a>
        <button class="nav-post-btn">ポストする</button>
        <div class="nav-account">
          <img class="avatar" src="icon.svg" alt="">
          <span>あなた</span>
        </div>
      </nav>

      <!-- 真ん中。ミッション 0〜4 で書いたのはこの中だけ -->
      <main>
        <!-- ① ヘッダー（ミッション 0）。更新ボタンはミッション 2 で足した -->
        <header class="header">
          <h1>ホーム</h1>
          <button id="reload-btn">更新</button>
        </header>

        <!-- ② 投稿欄（ミッション 0）。script.js が id でこの入力欄とボタンを探す -->
        <div class="compose">
          <img class="avatar" src="icon.svg" alt="">
          <div class="compose-body">
            <input id="name-input" type="text" placeholder="名前">
            <textarea id="text-input" placeholder="いまどうしてる？"></textarea>
            <button id="post-btn">ポストする</button>
          </div>
        </div>

        <!-- ④ タイムライン（ミッション 0）。中身は空で、script.js が投稿カードを入れる -->
        <ul id="timeline"></ul>

        <!-- ③ 投稿カードの見本（ミッション 0）。画面には出ず、script.js がコピーして使う -->
        <template id="post-template">
          <li class="post">
            <img class="avatar" src="icon.svg" alt="">
            <div class="post-body">
              <span class="name"></span>
              <p class="text"></p>
              <!-- いいねボタン（ミッション 4）。ハートの横にいいねの数が入る -->
              <button class="like-btn"><span class="like-count"></span></button>
            </div>
          </li>
        </template>
      </main>

      <!-- 右のサイドバー。検索とトレンドの飾りで、中身は決め打ちの文字 -->
      <aside class="sidebar-right">
        <div class="search-box">検索</div>
        <section class="trends">
          <h2>いまどうしてる？</h2>
          <div class="trend">
            <span class="trend-meta">日本のトレンド</span>
            <span class="trend-name">#ミニX</span>
            <span class="trend-meta">1,234件のポスト</span>
          </div>
          <div class="trend">
            <span class="trend-meta">学校・トレンド</span>
            <span class="trend-name">#高専</span>
            <span class="trend-meta">567件のポスト</span>
          </div>
          <div class="trend">
            <span class="trend-meta">テクノロジー・トレンド</span>
            <span class="trend-name">#JavaScript</span>
            <span class="trend-meta">8,901件のポスト</span>
          </div>
          <div class="trend">
            <span class="trend-meta">テクノロジー・トレンド</span>
            <span class="trend-name">#fetch</span>
            <span class="trend-meta">89件のポスト</span>
          </div>
          <div class="trend-more">さらに表示</div>
        </section>
      </aside>
    </div>

    <!-- 動きを書いた script.js を読み込む -->
    <script type="module" src="script.js"></script>
  </body>
</html>
