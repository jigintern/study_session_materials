<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 386" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Apple Color Emoji',sans-serif" font-size="21">
<rect width="1120" height="386" fill="white"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
</marker>
</defs>

<circle cx="54" cy="25" r="14" fill="#64748b"/>
<text x="54" y="33" text-anchor="middle" font-size="17" fill="#ffffff">1</text>
<text x="78" y="33" font-size="22" fill="#475569">要素を作る</text>
<text x="48" y="76" font-size="21" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#334155">const element = document.createElement(tagName);</text>

<rect x="130" y="96" width="220" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="240" y="124" text-anchor="middle" font-size="21" fill="#475569">作った要素</text>
<text x="240" y="148" text-anchor="middle" font-size="17" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#64748b">element</text>

<rect x="40" y="180" width="400" height="166" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="210" font-size="20" fill="#64748b">ページ (DOM)</text>
<rect x="62" y="224" width="356" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="240" y="273" text-anchor="middle" font-size="21" fill="#475569">親要素</text>
<text x="240" y="298" text-anchor="middle" font-size="17" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#64748b">parent</text>
<text x="240" y="376" text-anchor="middle" font-size="19" fill="#94a3b8">まだ画面に出ない</text>

<line x1="460" y1="263" x2="670" y2="263" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="565" y="243" text-anchor="middle" font-size="18" fill="#64748b">親要素の中に入る</text>

<circle cx="704" cy="25" r="14" fill="#64748b"/>
<text x="704" y="33" text-anchor="middle" font-size="17" fill="#ffffff">2</text>
<text x="728" y="33" font-size="22" fill="#475569">HTML につなぐ</text>
<text x="714" y="76" font-size="21" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#334155">parent.appendChild(element);</text>

<rect x="690" y="180" width="400" height="166" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="710" y="210" font-size="20" fill="#64748b">ページ (DOM)</text>
<rect x="712" y="224" width="356" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="732" y="252" font-size="20" fill="#475569">親要素</text>
<text x="810" y="252" font-size="17" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#64748b">parent</text>
<rect x="732" y="262" width="220" height="62" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<text x="842" y="288" text-anchor="middle" font-size="21" fill="#1e3a8a">作った要素</text>
<text x="842" y="312" text-anchor="middle" font-size="17" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#3b6cb8">element</text>
<text x="890" y="376" text-anchor="middle" font-size="19" fill="#64748b">ここではじめて画面に出る</text>
</svg>
