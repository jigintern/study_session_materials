<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Apple Color Emoji',sans-serif" font-size="21">
<rect width="1000" height="330" fill="white"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
</marker>
</defs>

<text x="500" y="40" text-anchor="middle" font-size="21" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#334155">document.getElementById("board")</text>

<rect x="20" y="64" width="420" height="244" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="40" y="92" font-size="20" fill="#64748b">ページ</text>

<rect x="42" y="104" width="376" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="230" y="137" text-anchor="middle" font-size="18" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#64748b">&lt;header id="status-bar"&gt;</text>

<rect x="42" y="166" width="376" height="52" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<text x="230" y="199" text-anchor="middle" font-size="18" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#1e3a8a">&lt;div id="board"&gt;</text>

<rect x="42" y="228" width="376" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="230" y="261" text-anchor="middle" font-size="18" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#64748b">&lt;button id="reset-btn"&gt;</text>

<line x1="452" y1="192" x2="622" y2="192" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="537" y="172" text-anchor="middle" font-size="18" fill="#64748b">一致した要素が返る</text>

<text x="642" y="150" font-size="20" fill="#64748b">返ってきた要素</text>
<rect x="642" y="164" width="330" height="64" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<text x="807" y="203" text-anchor="middle" font-size="18" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#1e3a8a">&lt;div id="board"&gt;</text>
</svg>
