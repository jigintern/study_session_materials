<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Apple Color Emoji',sans-serif" font-size="18">
<rect width="1120" height="420" fill="white"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
</marker>
</defs>

<text x="230" y="34" text-anchor="middle" font-size="19" fill="#64748b">HTML の入れ子</text>
<rect x="40" y="76" width="380" height="310" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="106" font-size="19" fill="#475569">card</text>
<rect x="62" y="122" width="336" height="246" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="82" y="152" font-size="19" fill="#475569">card-inner</text>
<rect x="90" y="170" width="134" height="134" rx="8" fill="#60a5fa"/>
<text x="157" y="252" text-anchor="middle" font-size="36" fill="#ffffff">?</text>
<text x="157" y="338" text-anchor="middle" font-size="18" fill="#475569">card-front</text>
<rect x="244" y="170" width="134" height="134" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="311" y="254" text-anchor="middle" font-size="36">🍎</text>
<text x="311" y="338" text-anchor="middle" font-size="18" fill="#475569">card-back</text>

<line x1="470" y1="86" x2="470" y2="390" stroke="#e2e8f0" stroke-width="2"/>

<text x="780" y="34" text-anchor="middle" font-size="19" fill="#64748b">画面での見え方</text>
<rect x="530" y="150" width="140" height="140" rx="10" fill="#60a5fa"/>
<text x="600" y="242" text-anchor="middle" font-size="44" fill="#ffffff">?</text>
<text x="600" y="330" text-anchor="middle" font-size="19" fill="#475569">伏せているとき</text>
<text x="600" y="364" text-anchor="middle" font-size="16" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#64748b">&lt;div class="card"&gt;</text>
<line x1="690" y1="196" x2="870" y2="196" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="780" y="174" text-anchor="middle" font-size="16" fill="#475569">flipped クラスを追加</text>
<line x1="870" y1="250" x2="690" y2="250" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="780" y="280" text-anchor="middle" font-size="16" fill="#475569">flipped クラスを削除</text>
<rect x="890" y="150" width="140" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="960" y="244" text-anchor="middle" font-size="44">🍎</text>
<text x="960" y="330" text-anchor="middle" font-size="19" fill="#475569">めくったとき</text>
<text x="960" y="364" text-anchor="middle" font-size="16" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#64748b">&lt;div class="card flipped"&gt;</text>
</svg>
